import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

// Produce a local inventory of selected dependencies, not every old JAR in a cache.
// ./gradlew -I tools/dependency-snapshot.init.gradle :app:dependencySecuritySnapshot
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('dependencySecuritySnapshot') {
        group = 'verification'
        doLast {
            def selectedModules = { configuration ->
                def resolution = configuration.incoming.resolutionResult
                if (resolution.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                    throw new GradleException("Incomplete dependency resolution for ${configuration.name}")
                }
                resolution.allComponents.collect { component ->
                    def id = component.id
                    id instanceof ModuleComponentIdentifier ? [name: "${id.group}:${id.module}", version: id.version] : null
                }.findAll { it != null }.unique().sort { a, b -> a.name <=> b.name ?: a.version <=> b.version }
            }
            def pluginLoader = app.plugins.getPlugin('com.android.application').class.classLoader
            def r8 = Class.forName('com.android.tools.r8.Version', false, pluginLoader)
                .getMethod('getVersionString').invoke(null)
            def report = [
                gradle: gradle.gradleVersion,
                effectiveR8: r8,
                appRuntime: selectedModules(app.configurations.getByName('deviceTestRuntimeClasspath')),
                buildPlugins: selectedModules(gradle.rootProject.buildscript.configurations.getByName('classpath'))
            ]
            def destination = app.layout.buildDirectory.file('reports/security/selected-dependencies.json').get().asFile
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
            logger.lifecycle("Selected dependency inventory written to ${destination}")
        }
    }
}
