name: Build isolated cumulative test7

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            label: arm64
          - abi: armeabi-v7a
            label: armv7
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Test upgrade, backup and native compatibility guards
      run: python3 -m unittest discover -s tools -p 'test_*.py'

    - name: Check reviewed native security pins
      run: python3 tools/check_native_security.py

    - name: Compute image tag
      id: img
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "tag=ghcr.io/$OWNER/translator-build:$(sha256sum Dockerfile | cut -c1-12)" >> $GITHUB_OUTPUT

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull or build image
      run: |
        TAG=${{ steps.img.outputs.tag }}
        if ! docker pull "$TAG" 2>/dev/null; then
          echo "Image missing, building..."
          docker build -t "$TAG" .
          docker push "$TAG"
        fi

    - name: Create disposable CI packaging signer
      run: |
        keytool -genkeypair -noprompt -storetype PKCS12 \
          -keystore "$RUNNER_TEMP/translator-ci.p12" \
          -storepass temporary-build -keypass temporary-build \
          -alias packaging -keyalg RSA -keysize 2048 -validity 2 \
          -dname "CN=Disposable CI packaging signer"

    - name: Build ${{ matrix.label }}
      run: |
        df -h .
        trap 'df -h .' EXIT
        docker run --rm \
          -v "$RUNNER_TEMP/translator-ci.p12:/tmp/translator-ci.p12:ro" \
          -e TRANSLATOR_TEST_KEYSTORE=/tmp/translator-ci.p12 \
          -e TRANSLATOR_TEST_STORE_PASSWORD=temporary-build \
          -e TRANSLATOR_TEST_KEY_ALIAS=packaging \
          -e TRANSLATOR_TEST_KEY_PASSWORD=temporary-build \
          -v ${{ github.workspace }}:/build/build/dev.davidv.translator/ \
          --user $(id -u):$(id -g) \
          ${{ steps.img.outputs.tag }} \
          ./gradlew --stacktrace :app:testDebugUnitTest :app:ktlintCheck :app:assembleDeviceTest -PtargetAbi=${{ matrix.abi }}

    - name: Check packaged native compatibility
      run: python3 tools/check_apk_native.py app/build/outputs/apk/deviceTest/app-${{ matrix.abi }}-deviceTest.apk --abi ${{ matrix.abi }}

    - name: Verify native PDF sources and record build evidence
      run: python3 tools/check_native_security.py --abi ${{ matrix.abi }} --apk app/build/outputs/apk/deviceTest/app-${{ matrix.abi }}-deviceTest.apk --report app/build/reports/security/native-${{ matrix.abi }}.json

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: intermediate-test7-${{ matrix.label }}
        path: |
          app/build/outputs/apk/**/*.apk
          app/build/reports/security/native-*.json
        retention-days: 30
