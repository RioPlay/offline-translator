name: Android device test

on:
  push:
    branches: [test/device-privacy-performance]

permissions:
  contents: read

concurrency:
  group: rioplay-device-test
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'RioPlay/offline-translator'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build existing Android toolchain image locally
        run: docker build -t offline-translator-test .

      - name: Assemble signed ARM64 test APK
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build/build/dev.davidv.translator" \
            offline-translator-test \
            ./gradlew --no-daemon assembleDeviceTest -PtargetAbi=arm64-v8a

      - name: Verify packaging and record provenance
        run: |
          mkdir -p device-test-output
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build/build/dev.davidv.translator" \
            offline-translator-test sh -eu -c '
              apk=app/build/outputs/apk/deviceTest/app-arm64-v8a-deviceTest.apk
              tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
              "$tools/apksigner" verify --verbose --print-certs "$apk" > device-test-output/signature.txt
              "$tools/aapt" dump badging "$apk" > device-test-output/badging.txt
              cp "$apk" device-test-output/offline-translator-arm64-test.apk
            '
          python3 - <<'PY'
          from pathlib import Path
          info = Path('device-test-output/badging.txt').read_text()
          assert "package: name='dev.davidv.translator.devicetest'" in info, 'Wrong application ID'
          assert "application-label:'Translator'" in info, 'Unexpected launcher name'
          assert "native-code: 'arm64-v8a'" in info, 'Wrong ABI'
          assert 'application-debuggable' not in info, 'Test build must retain non-debuggable release behavior'
          PY
          {
            echo "Candidate commit: $GITHUB_SHA"
            echo "Source base: 7a662629cb267483ddf3889c6fe42e8fb9462e0d"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Build: assembleDeviceTest -PtargetAbi=arm64-v8a"
            echo "Test-only signing key; not an official release."
            sha256sum Dockerfile app/build.gradle.kts
          } > device-test-output/BUILD.txt
          (cd device-test-output && sha256sum offline-translator-arm64-test.apk > SHA256SUMS)

      - name: Upload installable APK and build details
        uses: actions/upload-artifact@v4
        with:
          name: offline-translator-arm64-test-${{ github.sha }}
          path: device-test-output/
          if-no-files-found: error
          retention-days: 7
